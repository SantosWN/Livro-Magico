<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>O Livro Mágico de Leitura</title>

  <!-- PaperCSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/papercss@1.9.2/dist/paper.min.css"
  />

  <!-- CSS do projeto -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Rough Notation -->
  <script src="https://unpkg.com/rough-notation/lib/rough-notation.iife.js"></script>

  <!-- Rough.js -->
  <script src="https://unpkg.com/roughjs@latest/bundled/rough.js"></script>
</head>

<body>

  <main class="paper container main-container">

    <!-- CABEÇALHO -->
    <header class="header-bar">

      <h2 id="main-title">
        📚 O Livro Mágico
      </h2>

      <div class="header-buttons">

        <button
          id="btn-home"
          class="btn-small top-btn btn-secondary"
          style="display: none;"
          onclick="reiniciar()"
        >
          🏠 Início
        </button>

        <button
          id="music-toggle"
          class="btn-small top-btn"
          onclick="toggleMusica()"
        >
          🎵 Música: Off
        </button>

      </div>

    </header>


    <!-- ============================= -->
    <!-- TELA INICIAL -->
    <!-- ============================= -->

    <section id="welcome-screen">

      <div class="welcome-content">

        <div class="book-icon">
          📖✨
        </div>

        <h3>
          Bem-vindo ao Livro Mágico!
        </h3>

        <p class="text-center">
          Escolha uma aventura e digite o nome do(a) protagonista.
        </p>


        <!-- NOME -->
        <div class="form-group">

          <label for="child-name">
            Nome da Criança:
          </label>

          <input
            class="input-block"
            type="text"
            id="child-name"
            maxlength="30"
            autocomplete="off"
            placeholder="Ex: Sophia, Lucas, Gabriel..."
          />

        </div>


        <!-- HISTÓRIA -->
        <div class="form-group">

          <label for="story-select">
            Escolha uma Aventura:
          </label>

          <select
            id="story-select"
            class="input-block"
          >

            <option value="0">
              🌲 Aventura na Floresta Secreta
            </option>

            <option value="1">
              🚀 A Viagem Espacial
            </option>

          </select>

        </div>


        <!-- BOTÃO -->
        <button
          class="btn-primary btn-block start-button"
          onclick="iniciarHistoria()"
        >
          Começar a Leitura 🚀
        </button>

      </div>

    </section>


    <!-- ============================= -->
    <!-- LEITOR DA HISTÓRIA -->
    <!-- ============================= -->

    <section
      id="story-screen"
      class="card story-card"
      style="display: none;"
    >

      <div class="card-body">

        <!-- TÍTULO -->
        <div class="row flex-edges flex-middle story-header">

          <h3
            class="card-title"
            id="story-title"
          >
            Título
          </h3>

          <span
            class="page-indicator"
            id="page-indicator"
          >
            Página 1
          </span>

        </div>


        <!-- ILUSTRAÇÃO -->
        <div class="illustration-box">

          <canvas
            id="sketch-canvas"
            width="380"
            height="150"
          ></canvas>

        </div>


        <!-- TEXTO -->
        <div
          id="story-text"
          class="story-text-box"
        ></div>


        <!-- NAVEGAÇÃO -->
        <div
          class="row flex-edges flex-middle navigation-buttons"
        >

          <button
            id="btn-prev"
            class="btn-secondary"
            onclick="paginaAnterior()"
          >
            ← Anterior
          </button>


          <div>

            <button
              id="btn-next"
              class="btn-success"
              onclick="proximaPagina()"
            >
              Próxima →
            </button>


            <button
              id="btn-restart"
              class="btn-warning"
              style="display: none;"
              onclick="reiniciar()"
            >
              Outra História 🔄
            </button>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- SCRIPTS -->
  <script src="js/audio.js"></script>
  <script src="js/stories.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
